  return '<div class="pager"><span>共 '+total+' 条</span><div class="pager-right"><select aria-label="每页条数" data-page-size="'+key+'">'+(key==='cooperation'?[5,10,20]:[10,20,50]).map(n=>'<option value="'+n+'"'+(n===f.size?' selected':'')+'>'+n+' 条/页</option>').join('')+'</select><button class="pgbtn" data-action="page" data-id="'+key+'" data-page="'+(f.page-1)+'" aria-label="上一页"'+(f.page===1?' disabled':'')+'>‹</button>'+nums+'<button class="pgbtn" data-action="page" data-id="'+key+'" data-page="'+(f.page+1)+'" aria-label="下一页"'+(f.page===pages?' disabled':'')+'>›</button><span>前往</span><input type="number" min="1" max="'+pages+'" class="jump" aria-label="跳转页码" data-jump="'+key+'" value="'+f.page+'"><span>页</span><button class="pgbtn" data-action="jump" data-id="'+key+'">确定</button></div></div>';

async function refreshPlatformRoleCatalog(notify=true){
 if(platformRoleLoading)return;
 platformRoleLoading=true;platformRoleLoadError='';refreshPlatformRoleViews();
 try{
  const provider=window.managementRoleProvider;
  const snapshot=provider?.load?await provider.load():{roles:clone(DEMO_PLATFORM_ROLES)};
  if(!snapshot||!Array.isArray(snapshot.roles))throw new Error('invalid role list');
  const ids=new Set(),roles=snapshot.roles.map(r=>{const id=String(r?.id??'').trim(),name=String(r?.name??'').trim();if(!id||!name||ids.has(id)||['__proto__','constructor','prototype'].includes(id))throw new Error('invalid role');ids.add(id);return {id,name};});
  const assignments=snapshot.userRoleIds;
  if(assignments!==undefined&&(!assignments||typeof assignments!=='object'||Array.isArray(assignments)))throw new Error('invalid user roles');
  if(assignments)for(const roleIds of Object.values(assignments))if(!Array.isArray(roleIds)||roleIds.some(id=>typeof id!=='string'))throw new Error('invalid user role ids');
  latestOrgData();const before=clone(db);
  db.platformRoles=roles;db.platformRoleSource=provider?.load?'provider':'demo';
  if(assignments)allPeople().forEach(p=>{if(Object.prototype.hasOwnProperty.call(assignments,p.id))p.platformRoleIds=[...new Set(assignments[p.id])];});
  try{if(JSON.stringify(before)!==JSON.stringify(db))localStorage.setItem(STORE_KEY,JSON.stringify(db));}catch(error){db=before;throw error;}
  if(notify)toast((provider?.load?'角色清单已更新':'已刷新示例角色清单')+'，共 '+roles.length+' 个角色');
 }catch(error){platformRoleLoadError='load-failed';if(notify)toast('暂时无法获取中台角色清单，请重试');}

}

function normalizeRoles(){
 const legacy=(db.roleSchemaVersion||0)<3;
 if(!Array.isArray(db.roles)){
  db.roles=clone(roleSeeds);
  db.orgs.forEach(o=>{if(!o.roleBindings)o.roleBindings={'central-head':'role-head-standard','central-member':'role-member-standard'};});
 }
 db.roles.forEach(r=>{delete r.kind;});
 if(!Array.isArray(db.platformRoles)){db.platformRoles=clone(DEMO_PLATFORM_ROLES);db.platformRoleSource='demo';}
 db.orgs.forEach(o=>{
  if(!o.roleBindings)o.roleBindings={};
  if(legacy){for(const [oldId,newId] of [['heads','central-head'],['members','central-member']])if(Object.prototype.hasOwnProperty.call(o.roleBindings,oldId)){if(!Object.prototype.hasOwnProperty.call(o.roleBindings,newId))o.roleBindings[newId]=o.roleBindings[oldId];delete o.roleBindings[oldId];}}
 });
 for(const [people,demoId] of [[db.heads,'central-head'],[db.members,'central-member'],[db.enterprises,'central-enterprise']])people.forEach(p=>{if(!Array.isArray(p.platformRoleIds))p.platformRoleIds=legacy?[demoId]:[];});

 db.orgs.forEach(o=>{o.roleBindings=Object.fromEntries(Object.entries(o.roleBindings||{}).filter(([,value])=>value));});
 db.roleSchemaVersion=4;
}

function readConsultations(){
  consultReadFailed=false;
  try{
    const raw=localStorage.getItem(CONSULT_KEY);if(!raw)return consultationSeeds();
    const data=JSON.parse(raw);
    if(!Array.isArray(data)||data.some(r=>!r.id||!consultStatuses.includes(r.status)||!Array.isArray(r.logs)))throw Error('data');
    const examples=Object.fromEntries(consultationSeeds().map(r=>[r.id,r]));
    return data.map(r=>{const example=r.sample&&examples[r.id];return example?{...r,kind:consultKinds.includes(r.kind)?r.kind:example.kind,phone:r.phone||example.phone}:r;});
  }catch(e){consultReadFailed=true;return consultationSeeds();}
}

function saveConsultationHandling(){
  const note=document.getElementById('consult-handle-note').value.trim(),status=document.getElementById('consult-handle-status').value,error=document.getElementById('consult-handle-error');
  function fail(message){error.textContent=message;error.classList.add('show');}
  if(!note){fail('请填写处理记录。');document.getElementById('consult-handle-note').setAttribute('aria-invalid','true');document.getElementById('consult-handle-note').focus();return;}
  if(!consultStatuses.includes(status)){fail('请选择处理状态。');return;}
  const data=readConsultations();if(consultReadFailed){fail('未能读取最新咨询记录，填写内容已保留，请稍后重试。');return;}
  const r=data.find(x=>x.id===handlingConsultId);if(!r){fail('该记录已变化，请关闭后重新打开。');return;}
  const time=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());
  r.status=status;r.logs.push({time,actor:'张明（演示）',status,note});
  try{localStorage.setItem(CONSULT_KEY,JSON.stringify(data));}catch(e){fail('未能保存，处理记录已保留，请稍后重试。');return;}
  closeConsultationHandle();render();refreshConsultationDetail();toast('处理记录已保存。');
}

function saveHeadMembers(){
  const state=headMemberEditorState();if(!state)return;
  const changes=headMemberChanges(state);if(!changes.added.length&&!changes.removed.length)return;
  latestOrgData();const owner=head(state.headId);
  if(!owner)return formError('科研负责人信息已变化，请重新打开管理成员');
  const currentIds=membersOfHead(state.headId).map(m=>m.id).sort();
  if(JSON.stringify(currentIds)!==JSON.stringify([...state.original].sort()))return formError('负责人名下成员已变化，请重新打开后调整');
  if(changes.added.length&&!org(owner.orgId))return formError('请先为该科研负责人绑定机构，再添加新成员');
  if(changes.added.some(id=>!member(id)||member(id).headId))return formError('待添加成员已有负责人归属，请重新打开后选择');
  if(changes.removed.some(id=>JSON.stringify(teamsOfMember(id).map(t=>t.id).sort())!==JSON.stringify(state.originalTeams.get(id))))return formError('待移除成员参与的团队已变化，请重新打开后确认');
  const impact=headMemberRemovalImpact(state);
  if(impact.length&&state.confirmedImpact!==headMemberImpactSignature(impact))return formError('请确认将待移除成员先移出相关团队');
  const removed=new Set(changes.removed);
  db.teams.forEach(t=>{t.memberIds=t.memberIds.filter(id=>!removed.has(id));});
  changes.removed.forEach(id=>member(id).headId=null);
  changes.added.forEach(id=>member(id).headId=state.headId);
  const stored=save();closeModal();render();
  if(stored)toast('成员关联已更新：添加 '+changes.added.length+' 人，移除 '+changes.removed.length+' 人');
}

function moveMember(id,unlink){
  const m=member(id);if(!m||!m.headId)return;

  if(!unlink)body+=field('新的科研负责人','<select id="move-head" aria-label="新的科研负责人" class="select">'+headOptions('',null,current.id,'请选择新的科研负责人')+'</select>',true)+field('新负责人所属机构','<div class="readonly" id="derived-org">选择负责人后自动带出</div>');
  else body+='<div class="soft-panel">解除后，该成员可重新关联负责人。所属机构保持当前关联。</div>';
  body+=membershipCheck(ts,unlink?'unlink':'move');
  showModal(unlink?'解除成员关联':'调整成员归属',body,saveFooter(unlink?'确认解除':'确认调整'),'',()=>{
    const newId=unlink?null:document.getElementById('move-head').value;
    latestOrgData();const latestMember=member(id),latestTeams=teamsOfMember(id);
    if(!latestMember||latestMember.headId!==current.id)return formError('成员归属已变化，请关闭后重新确认');
    if(JSON.stringify(latestTeams.map(t=>t.id).sort())!==JSON.stringify(ts.map(t=>t.id).sort()))return formError('成员参与的团队已变化，请关闭后重新确认');
    if(!unlink&&(!newId||newId===latestMember.headId||!head(newId)?.orgId))return formError('请选择新的科研负责人');
    if(latestTeams.length&&!document.getElementById('clear-teams')?.checked)return formError('请确认先移出原团队，再'+(unlink?'解除关联':'调整归属'));
    db.teams.forEach(t=>{t.memberIds=t.memberIds.filter(x=>x!==id);});
    latestMember.headId=newId;finish(unlink?'已解除 '+latestMember.name+' 的负责人关联':latestMember.name+' 已归属 '+head(newId).name);
  },unlink?'unlink-member':'move-member');
}
function teamSimpleRows(ts,identity){
  return ts.length?'<div class="simple-list">'+ts.map(t=>'<div class="simple-row"><div>'+link(t.name,'team-detail',t.id,'text')+'<div class="desc">团队负责人：'+esc(head(t.headId).name)+' · '+orgName(orgOfHead(t.headId))+'</div></div>'+badge(identity,identity==='负责人'?'':'gray')+'</div>').join('')+'</div>':'<div class="soft-panel">暂无'+(identity==='负责人'?'负责的':'受邀参与的')+'团队</div>';
}
function headDetail(id){
  const h=head(id);if(!h)return;
  const ms=membersOfHead(id),own=ownTeams(id),joined=joinedTeams(id);
  const body='<div class="summary-person"><span class="person-avatar blue">'+esc(h.name.slice(-1))+'</span><div><div class="name">'+esc(h.name)+' '+badge('科研负责人','blue')+'</div><div class="subline">'+esc(h.account)+'</div></div></div><div class="info-grid">'+infoItem('所属机构',orgName(orgOfHead(id)),true)+'</div><div class="section-label"><span>名下普通成员 <span class="muted small">'+ms.length+' 人</span></span>'+'</div>'+(ms.length?'<div class="simple-list">'+ms.map(m=>'<div class="simple-row">'+person(m,'member-detail',false)+'<span class="muted small">参与 '+teamsOfMember(m.id).length+' 个团队</span></div>').join('')+'</div>':'<div class="soft-panel">暂无名下普通成员</div>')+'<div class="section-label">负责的团队 <span class="muted small">'+own.length+' 个</span></div>'+teamSimpleRows(own,'负责人')+'<div class="section-label">受邀参与的团队 <span class="muted small">'+joined.length+' 个</span></div>'+teamSimpleRows(joined,'成员');
  showModal('科研负责人详情',body,btn('关闭','close-modal',null,'primary'),'wide',null,'view');
}
function memberDetail(id){
  const m=member(id);if(!m)return;const h=head(m.headId),ts=teamsOfMember(id);
  const body='<div class="summary-person"><span class="person-avatar">'+esc(m.name.slice(-1))+'</span><div><div class="name">'+esc(m.name)+' '+badge('普通成员','gray')+'</div><div class="subline">'+esc(m.account)+'</div></div></div><div class="info-grid">'+infoItem('归属负责人',h?link(h.name,'head-detail',h.id):'<span class="muted">未关联负责人</span>')+infoItem('所属机构',orgName(orgOfMember(m)))+'</div><div class="section-label">参与团队 <span class="muted small">'+ts.length+' 个</span></div>'+(ts.length?teamSimpleRows(ts,'成员'):'<div class="soft-panel">暂无参与的团队</div>');
  showModal('普通成员详情',body,btn('关闭','close-modal'),'',null,'view');
}
function spaceDetail(id){
  const s=db.spaces.find(x=>x.id===id);if(!s)return;const t=team(s.teamId);
  const body='<div class="info-grid">'+infoItem('科研空间',esc(s.name),true)+infoItem('关联类型',badge(s.type,s.type==='需求'?'blue':''))+infoItem('创建人',esc(head(s.creatorId)?.name||'—'))+infoItem('关联'+esc(s.type),esc(s.workName),true)+infoItem('绑定团队',link(t.name,'team-detail',t.id),true)+'</div>';
  showModal('科研空间信息',body,btn('关闭','close-modal',null,'primary'),'',null,'view');
}
function applyFilter(form,changed){
  const key=form.dataset.key,f=filters[key],values=new FormData(form);
  if(key==='cooperation'){
    const start=String(values.get('start')||''),end=String(values.get('end')||'');
    if(start&&end&&start>end){formError('提交结束日期不能早于开始日期。');document.getElementById('consult-end').focus();return;}
    Object.assign(f,{q:String(values.get('q')||'').trim(),kind:String(values.get('kind')||''),start,end,page:1});render();return;
  }
  f.q=String(values.get('q')||'');
  if(key==='roles'){f.page=1;render();return;}
  if(key==='institutions')institutionSelection.clear();
  if(key!=='institutions'){f.org=String(values.get('org')||'');f.head=changed==='org'?'':String(values.get('head')||'');if(key==='people'){f.kind=String(values.get('kind')||'');f.relation=String(values.get('relation')||'');if(f.kind!=='members'||changed==='kind'){f.head='';f.relation='';}}}
  if(personnelSelection[key])personnelSelection[key].clear();
  f.page=1;render();
}
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-action]');if(!el||el.disabled)return;
  const action=el.dataset.action,id=el.dataset.id;
  switch(action){
    case 'add-role-mapping':changeInstitutionMappingRows();break;
    case 'remove-role-mapping':changeInstitutionMappingRows(id);break;
    case 'refresh-platform-roles':refreshPlatformRoleCatalog();break;
    case 'new-role':editRole(null);break;
    case 'edit-role':editRole(id);break;
    case 'copy-role':editRole(id,true);break;
    case 'view-role':viewRole(id);break;
    case 'delete-role':deleteRole(id);break;
    case 'bind-org-role':openRoleBinding('org',[id],null);break;
    case 'batch-org-role':openRoleBinding('org',[...institutionSelection],null,true);break;
    case 'bind-role-organization':bindRoleOrganization(id);break;
    case 'bind-person-role':openRoleBinding('person',[id],personKind(id));break;
    case 'batch-person-role':openRoleBinding('person',[...personnelSelection[id]],id,true);break;
    case 'clear-institution-selection':institutionSelection.clear();updateInstitutionSelection();break;
    case 'role-target-remove':{const b=roleBinding();if(b){b.selected.delete(id);drawBindingTargets();}break;}
    case 'role-target-clear':{const b=roleBinding();if(b){b.selected.clear();drawBindingTargets();}break;}

    case 'header-logout':showModal('退出登录','<p>确认退出当前演示账号？</p>',saveFooter('确认'),'compact',()=>{location.href='后台-登录.html';},'header-logout');break;
    case 'consult-status':filters.cooperation.status=id||'';filters.cooperation.page=1;render();break;
    case 'consult-detail':openConsultation(id);break;
    case 'consult-handle':openConsultationHandle(id);break;
    case 'consult-close-handle':closeConsultationHandle();break;
    case 'new-org':go('institutions/new');break;
    case 'edit-org':go('institutions/'+id+'/edit');break;
    case 'save-org-page':if(orgPageSubmit)orgPageSubmit();break;
    case 'org-detail':go('institutions/'+id);break;
    case 'org-tab':detailTabs['org-'+id]=el.dataset.tab;render();break;
    case 'team-detail':openTeam(id);break;
    case 'new-team':go('teams/new');break;
    case 'edit-team':go('teams/'+id+'/edit');break;
    case 'save-team':saveTeam();break;
    case 'add-team-members':addTeamMembers();break;
    case 'remove-team-member':if(teamDraft&&id!==teamDraft.headId){teamDraft.memberIds=teamDraft.memberIds.filter(x=>x!==id);teamDraft.guestIds=teamDraft.guestIds.filter(x=>x!==id);drawTeamMembers(teamDraft,true);}break;
    case 'delete-team':deleteTeam(id);break;
    case 'person-detail':
    case 'head-detail':go('members/'+id);break;
    case 'member-detail':go('members/'+id);break;
    case 'edit-person':go('members/'+id+'/edit');break;
    case 'save-person':if(personSubmit)personSubmit();break;
    case 'space-detail':spaceDetail(id);break;
    case 'batch-link-org':batchLinkOrg(id);break;
    case 'batch-unlink-org':if(personnelSelection[id])openBatchOrganization(id,'unlink');break;
    case 'batch-remove-person':selectBatchOrganizationPerson(id,false);drawBatchOrganization();break;
    case 'batch-clear-people':{const state=batchOrganizationState();if(state){state.selected.clear();state.original.clear();drawBatchOrganization();}break;}
    case 'link-person-org':if(getPerson(id))linkPeopleOrg(personKind(id),[id]);break;
    case 'unlink-person-org':if(getPerson(id))unlinkPeopleOrg(personKind(id),[id]);break;
    case 'clear-person-selection':personnelSelection[id]?.clear();updatePersonnelSelection(id);break;
    case 'move-member':moveMember(id,false);break;
    case 'unlink-member':moveMember(id,true);break;
    case 'head-members':manageHeadMembers(id);break;
    case 'head-member-remove':selectHeadMember(id,false);drawHeadMembers();break;
    case 'head-member-clear':{const state=headMemberEditorState();if(state){state.selected.clear();drawHeadMembers();}break;}
    case 'back':go(id);break;
    case 'close-modal':closeModal();break;
    case 'modal-submit':if(modalState?.onSubmit)modalState.onSubmit();break;
    case 'reset-filter':if(id==='roles'){filters.roles={q:'',page:1,size:filters.roles.size};render();break;}if(id==='institutions')institutionSelection.clear();if(personnelSelection[id])personnelSelection[id].clear();filters[id]=id==='cooperation'?{q:'',kind:'',start:'',end:'',status:'',page:1,size:filters[id].size}:{q:'',kind:'',org:'',head:'',relation:'',page:1,size:filters[id].size};render();break;
    case 'page':filters[id].page=Number(el.dataset.page)||1;render();break;
    case 'jump':{
      const input=document.querySelector('[data-jump="'+id+'"]'),n=Number(input.value),max=Number(input.max);
      if(!Number.isInteger(n)||n<1||n>max){toast('请输入 1 至 '+max+' 之间的页码');input.focus();return;}
      filters[id].page=n;render();break;
    }
  }
});
document.addEventListener('submit',e=>{if(e.target.id==='main-filter'){e.preventDefault();applyFilter(e.target);}});
document.addEventListener('input',e=>{if(e.target.id==='role-target-search'){const b=roleBinding();if(b){b.query=e.target.value;drawBindingTargets();}}if(['team-name','team-intro'].includes(e.target.id))main.querySelector('#form-error')?.classList.remove('show');if(e.target.id==='head-member-search'){const state=headMemberEditorState();if(state){state.query=e.target.value;drawHeadMembers();}}if(e.target.id==='batch-person-search'){const state=batchOrganizationState();if(state){state.query=e.target.value;drawBatchOrganization();}}if(e.target.id==='picker-search'&&modalState?.kind==='team-candidates')refreshTeamCandidates();});
document.addEventListener('change',function(e){if(e.target&&e.target.matches&&e.target.matches('[data-role-policy]')){roleModeHintSync();}
  const el=e.target;
  if(el.hasAttribute('data-platform-role-source')){updateMappingSourceChoices();}
  else if(el.hasAttribute('data-role-preview')||el.id==='person-role-override'||el.id==='person-role-inherit'){refreshRolePreviews();}
  else if(el.dataset.roleTarget){const b=roleBinding();if(b){el.checked?b.selected.add(el.dataset.roleTarget):b.selected.delete(el.dataset.roleTarget);drawBindingTargets();}}
  else if(el.id==='role-target-all'){const b=roleBinding();if(b){bindingCandidates(b).forEach(x=>el.checked?b.selected.add(x.id):b.selected.delete(x.id));drawBindingTargets();}}
  else if(el.dataset.institutionCheck){el.checked?institutionSelection.add(el.dataset.institutionCheck):institutionSelection.delete(el.dataset.institutionCheck);updateInstitutionSelection();}
  else if(el.id==='institution-select-all'){institutionPageIds.forEach(id=>el.checked?institutionSelection.add(id):institutionSelection.delete(id));updateInstitutionSelection();}
  else if(el.dataset.headMemberPick){selectHeadMember(el.dataset.headMemberPick,el.checked);drawHeadMembers();}
  else if(el.id==='head-member-select-results'){const state=headMemberEditorState();if(state){headMemberCandidates(state).forEach(m=>selectHeadMember(m.id,el.checked));drawHeadMembers();}}
  else if(el.id==='head-member-org'){const state=headMemberEditorState();if(state){state.orgFilter=el.value;drawHeadMembers();}}
  else if(el.id==='head-member-clear-teams'){const state=headMemberEditorState();if(state){state.confirmedImpact=el.checked?headMemberImpactSignature(headMemberRemovalImpact(state)):'';updateHeadMemberControls();}}
  else if(el.dataset.batchPerson){selectBatchOrganizationPerson(el.dataset.batchPerson,el.checked);drawBatchOrganization();}
  else if(el.id==='batch-select-results'){const state=batchOrganizationState();if(state){batchOrganizationCandidates(state).forEach(p=>selectBatchOrganizationPerson(p.id,el.checked));drawBatchOrganization();}}
  else if(el.id==='batch-person-org'){const state=batchOrganizationState();if(state){state.orgFilter=el.value;drawBatchOrganization();}}
  else if(el.id==='batch-org'&&batchOrganizationState())updateBatchOrganizationControls();
  else if(el.dataset.personCheck){const key=el.dataset.personKind;el.checked?personnelSelection[key].add(el.dataset.personCheck):personnelSelection[key].delete(el.dataset.personCheck);updatePersonnelSelection(key);}
  else if(el.dataset.personAll){const key=el.dataset.personAll;personnelPageIds[key].forEach(id=>el.checked?personnelSelection[key].add(id):personnelSelection[key].delete(id));updatePersonnelSelection(key);}
  else if(el.dataset.pageSize){const f=filters[el.dataset.pageSize];f.size=Number(el.value);f.page=1;render();}
  else if(el.dataset.filterChange)applyFilter(el.closest('form'),el.dataset.filterChange);
  else if(el.dataset.pick&&modalState){el.checked?modalState.selected.add(el.dataset.pick):modalState.selected.delete(el.dataset.pick);updatePickCount();}
  else if(el.id==='team-head')changeNewTeamHead(el.value);
  else if(el.id==='move-head'){const o=orgOfHead(el.value);document.getElementById('derived-org').innerHTML=o?orgName(o):'选择负责人后自动带出';}
});
document.addEventListener('keydown',function(e){
  if(consultHandleDialog.open)return;
  if(mask.classList.contains('open')){
    if(e.key==='Escape'){e.preventDefault();closeModal();return;}
    if(e.key==='Tab'){
      const focus=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href]')].filter(x=>x.offsetParent!==null);
      if(!focus.length)return;const first=focus[0],last=focus[focus.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }
    if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox'&&!['picker-search','batch-person-search','head-member-search','role-target-search'].includes(e.target.id)&&modalState?.onSubmit){e.preventDefault();modalState.onSubmit();}
  }else if(e.key==='Enter'&&e.target.dataset.jump){e.preventDefault();document.querySelector('[data-action="jump"][data-id="'+e.target.dataset.jump+'"]').click();}
});
window.addEventListener('hashchange',()=>{closeModal();readRoute();window.scrollTo({top:0});});
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
readRoute();
if(window.managementRoleProvider?.load)refreshPlatformRoleCatalog(false);
})();
</script>
</body>
