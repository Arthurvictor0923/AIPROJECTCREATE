function normalizedPolicy(rule,account){

function subjectPolicies(kind,id,store=readResourcePolicies()){

function effectiveResourcePolicy(accountId,type,store=readResourcePolicies()){

  const own=subjectPolicies('account',accountId,store)[type];
  if(!own)return {...normalizedPolicy(null,false),source:'default',sourceName:'按申请流程'};
  if(own.mode!=='inherit')return {...own,source:'account',sourceName:'账号单独设置'};
  const institution=org(h.orgId);
  if(!institution)return {...normalizedPolicy(null,false),source:'default',sourceName:'未关联机构'};

  if(hasValidAuthorization||hasApplicableTeamExemption)return false;

function writeEditedPermissions(targetId,organizationPayload){
  const ed=permissionEditor,error=validatePermissionEditor();if(error)throw new Error(error);
  const store=readResourcePolicies(),latest=subjectPolicies(ed.kind,ed.id,store);
  if(JSON.stringify(latest)!==ed.base)throw new Error('该对象的资源权限已更新，请重新打开后设置');
  const bucket=ed.kind==='org'?'orgs':'accounts',value=clone(ed.rules);
  for(const [type]of RESOURCE_TYPES){if(value[type].mode!=='free')value[type]={mode:value[type].mode};else if(value[type].scope==='all')value[type].ids=[];}
  const changed=JSON.stringify(subjectPolicies(ed.kind,ed.id,store))!==JSON.stringify(Object.fromEntries(RESOURCE_TYPES.map(([t])=>[t,normalizedPolicy(value[t],ed.kind==='account')])));
  if(changed){
    store[bucket][targetId]={...value,updatedBy:'张明',updatedAt:new Date().toISOString()};
    store.history=Array.isArray(store.history)?store.history:[];
    store.history.push({subjectType:ed.kind,subjectId:targetId,before:latest,after:value,by:'张明',at:new Date().toISOString()});
  }
  const previousPolicy=localStorage.getItem(RESOURCE_POLICY_KEY),previousOrganization=localStorage.getItem(STORE_KEY);

    if(changed)localStorage.setItem(RESOURCE_POLICY_KEY,JSON.stringify(store));
    if(organizationPayload)localStorage.setItem(STORE_KEY,JSON.stringify(organizationPayload));
  }catch(error){
    try{if(previousPolicy===null)localStorage.removeItem(RESOURCE_POLICY_KEY);else localStorage.setItem(RESOURCE_POLICY_KEY,previousPolicy);if(organizationPayload){if(previousOrganization===null)localStorage.removeItem(STORE_KEY);else localStorage.setItem(STORE_KEY,previousOrganization);}}catch{}

  }
}

function readConsultations(){
  consultReadFailed=false;
  try{
    const raw=localStorage.getItem(CONSULT_KEY);if(!raw)return consultationSeeds();
    const data=JSON.parse(raw);
    if(!Array.isArray(data)||data.some(r=>!r.id||!consultStatuses.includes(r.status)||!Array.isArray(r.logs)))throw Error('data');
    const examples=Object.fromEntries(consultationSeeds().map(r=>[r.id,r]));
    return data.map(r=>{const example=r.sample&&examples[r.id];return example?{...r,kind:consultKinds.includes(r.kind)?r.kind:example.kind,phone:r.phone||example.phone}:r;});
  }catch(e){consultReadFailed=true;return consultationSeeds();}
}

  main.innerHTML='<button class="back" data-action="back" data-id="institutions">'+icon('back')+'返回机构列表</button>'+title(readonly?'机构详情':o?'编辑机构':'新增机构',readonly?'':'<div class="ops">'+btn('取消','back','institutions')+btn('保存','save-org-page',null,'primary')+'</div>')+'<div class="form-error" id="form-error" role="alert"></div><section class="card detail-intro"><div class="intro-top"><div class="org-symbol">'+icon('org')+'</div><div class="intro-body">'+basic+'</div></div></section>'+(readonly?policySummaryCard('org',id):'<section class="card detail-section"><div class="card-hd"><h2>资源使用权限</h2></div><div class="permission-edit-body" id="resource-policy-editor"></div></section>')+'<section class="card"><div class="card-hd"><h2>科研负责人<span class="count">'+(readonly?'共 '+hs.length+' 人':'')+'</span></h2>'+(readonly?'':btn(icon('plus')+'添加科研负责人','add-org-head',null,'small primary'))+'</div><div id="org-head-list"></div></section>';
  drawOrgHeads(readonly,hs);

  orgPageSubmit=readonly?null:()=>{
    const name=document.getElementById('org-name').value.trim(),intro=document.getElementById('org-intro').value.trim();

    const permissionError=validatePermissionEditor();if(permissionError)return formError(permissionError);
    if(db.orgs.some(x=>x.id!==id&&x.name===name))return formError('该机构名称已存在');
    const selected=orgDraft.selected;
    latestOrgData();
    const conflict=[...selected].filter(x=>!head(x)||(head(x).orgId&&head(x).orgId!==id));
    if(conflict.length)return formError('以下账号已被其他机构关联，请移除后重新选择：'+conflict.map(x=>head(x)?.name||x).join('、'));
    const currentOrg=id?org(id):null;
    if(id&&!currentOrg)return formError('机构已发生变化，请返回列表刷新');
    if(hs.some(h=>!selected.has(h.id)&&blocked(h)))return formError('负责人仍有关联人员或团队，不能解除机构关联');
    const targetId=o?id:'o'+(++uid),beforeDb=clone(db);
    if(currentOrg){if(currentOrg.name!==name)currentOrg.short=name;currentOrg.name=name;currentOrg.intro=intro;}else{db.orgs.push({id:targetId,name,short:name,intro});filters.institutions.q='';filters.institutions.page=Math.ceil(db.orgs.length/filters.institutions.size);}
    orgDraft.original.forEach(x=>{const h=head(x);if(h&&h.orgId===id&&!selected.has(x))h.orgId=null;});
    selected.forEach(x=>head(x).orgId=targetId);
    try{writeEditedPermissions(targetId,db);}catch(error){db=beforeDb;return formError(error.message);}
    if(route.startsWith('institutions/')){route='institutions';history.replaceState(null,'','#institutions');}
    permissionEditor=null;go('institutions/'+targetId);toast(o?'机构信息与资源权限已更新':'机构已新增');
  };

function pickerShell(){return '<div class="picker"><div class="picker-search"><input class="input" id="picker-search" aria-label="搜索候选账号" placeholder="搜索姓名或账号"><span class="muted small">已有账号</span></div><div class="picker-list" id="picker-list"></div><div class="picker-foot" id="picker-count"></div></div>';}
function refreshPicker(){

function moveMember(id,unlink){

  },unlink?'unlink-member':'move-member');

function applyFilter(form,changed){
  const key=form.dataset.key,f=filters[key],values=new FormData(form);
  if(key==='cooperation'){
    const start=String(values.get('start')||''),end=String(values.get('end')||'');
    if(start&&end&&start>end){formError('提交结束日期不能早于开始日期。');document.getElementById('consult-end').focus();return;}
    Object.assign(f,{q:String(values.get('q')||'').trim(),kind:String(values.get('kind')||''),start,end,page:1});render();return;
  }
  f.q=String(values.get('q')||'');
  if(key!=='institutions'){f.org=String(values.get('org')||'');f.head=changed==='org'?'':String(values.get('head')||'');if(key==='members')f.relation=String(values.get('relation')||'');}
  f.page=1;render();
}
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-action]');if(!el||el.disabled)return;
  const action=el.dataset.action,id=el.dataset.id;
  switch(action){
    case 'header-logout':showModal('退出登录','<p>确认退出当前演示账号？</p>',saveFooter('确认'),'compact',()=>{location.href='后台-登录.html';},'header-logout');break;
    case 'consult-status':filters.cooperation.status=id||'';filters.cooperation.page=1;render();break;
    case 'consult-detail':openConsultation(id);break;
    case 'consult-handle':openConsultationHandle(id);break;
    case 'consult-close-handle':closeConsultationHandle();break;
    case 'org-policy':openResourcePolicy('org',id);break;
    case 'account-policy':openResourcePolicy('account',id);break;
    case 'new-org':go('institutions/new');break;
    case 'edit-org':go('institutions/'+id+'/edit');break;
    case 'add-org-head':addOrgHeads();break;
    case 'remove-org-head':if(orgDraft){if(orgDraft.original.has(id)&&(membersOfHead(id).length||ownTeams(id).length||joinedTeams(id).length)){toast('该负责人仍有关联人员或团队，不能解除机构关联');break;}orgDraft.selected.delete(id);drawOrgHeads(false);}break;
    case 'save-org-page':if(orgPageSubmit)orgPageSubmit();break;
    case 'org-detail':go('institutions/'+id);break;
    case 'org-tab':detailTabs['org-'+id]=el.dataset.tab;render();break;
    case 'team-detail':openTeam(id);break;
    case 'new-team':go('teams/new');break;
    case 'edit-team':go('teams/'+id+'/edit');break;
    case 'save-team':saveTeam();break;
    case 'add-team-members':addTeamMembers();break;
    case 'remove-team-member':if(teamDraft&&id!==teamDraft.headId){teamDraft.memberIds=teamDraft.memberIds.filter(x=>x!==id);teamDraft.guestIds=teamDraft.guestIds.filter(x=>x!==id);drawTeamMembers(teamDraft,true);}break;
    case 'delete-team':deleteTeam(id);break;
    case 'reset-password':resetPassword(id);break;
    case 'head-detail':go('members/'+id);break;
    case 'member-detail':go('members/'+id);break;
    case 'edit-person':go('members/'+id+'/edit');break;
    case 'save-person':if(personSubmit)personSubmit();break;
    case 'person-tab':personnelTab=id;go('members');break;
    case 'space-detail':spaceDetail(id);break;
    case 'bind-heads':bindHeads(id);break;
    case 'assign-members':assignMembers();break;
    case 'assign-to-head':assignMembers(id);break;
    case 'assign-single':assignMembers(null,id);break;
    case 'move-member':moveMember(id,false);break;
    case 'unlink-member':moveMember(id,true);break;
    case 'unlink-head':unlinkHead(id);break;
    case 'head-members':personnelTab='members';filters.members={q:'',org:head(id).orgId||'',head:id,relation:'',page:1,size:10};go('members');break;
    case 'back':go(id);break;
    case 'close-modal':closeModal();break;
    case 'modal-submit':if(modalState?.onSubmit)modalState.onSubmit();break;
    case 'reset-filter':filters[id]=id==='cooperation'?{q:'',kind:'',start:'',end:'',status:'',page:1,size:filters[id].size}:{q:'',org:'',head:'',relation:'',page:1,size:filters[id].size};render();break;
    case 'page':filters[id].page=Number(el.dataset.page)||1;render();break;
    case 'jump':{
      const input=document.querySelector('[data-jump="'+id+'"]'),n=Number(input.value),max=Number(input.max);
      if(!Number.isInteger(n)||n<1||n>max){toast('请输入 1 至 '+max+' 之间的页码');input.focus();return;}
      filters[id].page=n;render();break;
    }
  }
});
document.addEventListener('submit',e=>{if(e.target.id==='main-filter'){e.preventDefault();applyFilter(e.target);}});
document.addEventListener('input',e=>{if(['team-name','team-intro'].includes(e.target.id))main.querySelector('#form-error')?.classList.remove('show');if(e.target.id==='picker-search'){if(modalState?.kind==='org-candidates')refreshOrgCandidates();else if(modalState?.kind==='team-candidates')refreshTeamCandidates();else refreshPicker();}});
document.addEventListener('change',function(e){
  const el=e.target;
  if(el.dataset.pageSize){const f=filters[el.dataset.pageSize];f.size=Number(el.value);f.page=1;render();}
  else if(el.dataset.filterChange)applyFilter(el.closest('form'),el.dataset.filterChange);
  else if(el.dataset.pick&&modalState){el.checked?modalState.selected.add(el.dataset.pick):modalState.selected.delete(el.dataset.pick);updatePickCount();}
  else if(el.id==='team-head')changeNewTeamHead(el.value);
  else if(el.id==='assign-head'||el.id==='move-head'){const o=orgOfHead(el.value);document.getElementById('derived-org').innerHTML=o?orgName(o):'选择负责人后自动带出';}
});
document.addEventListener('keydown',function(e){
  if(consultHandleDialog.open)return;
  if(mask.classList.contains('open')){
    if(e.key==='Escape'){e.preventDefault();closeModal();return;}
    if(e.key==='Tab'){
      const focus=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href]')].filter(x=>x.offsetParent!==null);
      if(!focus.length)return;const first=focus[0],last=focus[focus.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }
    if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox'&&e.target.id!=='picker-search'&&modalState?.onSubmit){e.preventDefault();modalState.onSubmit();}
  }else if(e.key==='Enter'&&e.target.dataset.jump){e.preventDefault();document.querySelector('[data-action="jump"][data-id="'+e.target.dataset.jump+'"]').click();}
});
window.addEventListener('hashchange',()=>{closeModal();readRoute();window.scrollTo({top:0});});
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
readRoute();
})();
</script>
</body>
</html>
